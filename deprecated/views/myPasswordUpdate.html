<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RallyPoint - Update Password" />
    <link rel="icon" href="/img/favicon.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/rallypoint.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <script type="module" src="/js/index.js" defer></script>
    <script type="module" src="/js/passwordUpdate.js" defer></script>
    <title>RallyPoint - Update Password</title>
  </head>
  <body>
    <header>
      <h1>RallyPoint</h1>
    </header>

    <nav>
      <a href="/" aria-label="Home">
        <i class="fas fa-home"></i>
      </a>
      <a href="/events/myBrowse" aria-label="My Events">
        <i class="fas fa-calendar-check"></i>
      </a>
      <a href="/events/browseNew" aria-label="Find Events">
        <i class="fas fa-search"></i>
      </a>
      <a href="/me/account" aria-label="Profile" class="active">
        <i class="fas fa-user"></i>
      </a>
      <a href="#" id="logoutButton" aria-label="Logout">
        <i class="fas fa-sign-out-alt"></i>
      </a>
    </nav>

    <main class="main">
      <section class="section">
        <div class="container">
          <div class="card">
            <div class="card__content">
              <h2 class="text-center mb-lg">Update Your Password</h2>

              <ul class="account-tabs">
                <li><a href="/me/account">Profile</a></li>
                <li class="active">
                  <a href="/me/passwordUpdate">Change Password</a>
                </li>
              </ul>

              <form id="updatePasswordForm" class="form">
                <div class="form-group">
                  <label for="currentPassword">Current Password</label>
                  <input
                    name="currentPassword"
                    type="password"
                    id="currentPassword"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="newPassword">New Password</label>
                  <input
                    name="newPassword"
                    type="password"
                    id="newPassword"
                    required
                  />
                  <button
                    type="button"
                    id="toggleNewPassword"
                    class="btn-icon mt-sm"
                  >
                    <i class="fas fa-eye"></i> Show Password
                  </button>
                </div>

                <div class="form-group">
                  <label for="newPasswordConfirm">Confirm New Password</label>
                  <input
                    name="newPasswordConfirm"
                    type="password"
                    id="newPasswordConfirm"
                    required
                  />
                  <button
                    type="button"
                    id="togglePasswordConfirm"
                    class="btn-icon mt-sm"
                  >
                    <i class="fas fa-eye"></i> Show Password
                  </button>
                </div>

                <input type="hidden" id="userId" />

                <div class="password-strength" id="passwordStrength">
                  <div class="password-strength-bar">
                    <div class="strength-meter" id="strengthMeter"></div>
                  </div>
                  <p class="password-feedback" id="passwordFeedback">
                    Password should be at least 8 characters
                  </p>
                </div>

                <script>
                  // Set the user ID from session data
                  document.addEventListener("DOMContentLoaded", () => {
                    if (
                      window.templateData &&
                      window.templateData.user &&
                      window.templateData.user._id
                    ) {
                      document.getElementById("userId").value =
                        window.templateData.user._id;
                    }
                  });
                </script>

                <div class="form-buttons">
                  <button type="submit" class="btn btn--primary">
                    <i class="fas fa-key"></i> Update Password
                  </button>
                  <a href="/me/account" class="btn btn--outline">Cancel</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer text-center mt-lg">
      <p>&copy; 2025 RallyPoint. All rights reserved.</p>
    </footer>

    <!-- Alert container for displaying messages -->
    <div id="alert" class="alert hidden"></div>
  </body>
</html>
