<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="Pickleball admin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/img/favicon.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/mediaQueries.css" />
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.4.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule=""
      src="https://unpkg.com/ionicons@5.4.0/dist/ionicons/ionicons.js"
    ></script>
    <title>Pickleball| Admin</title>
  </head>
  <body>
    <header class="header">
      <a class="logo" href="/">
        <img src="/img/logo.png" alt="Pickle Logo" />
      </a>
    </header>

    <main class="main">
      <section class="section">
        <div class="homepage">
          <div class="homepage-text-box">
            <h1 class="heading-primary">Let's play !!!</h1>
            <p class="homepage-description">
              <a href="/me/login" class="btn btn--form margin-right-sm"
                >Login</a
              >
              <a href="/me/signUp" class="btn btn--outline">Signup</a>
            </p>
          </div>
          <div class="homepage-img-box">
            <img
              src="img/homepage.png"
              class="homepage-img"
              alt="PickleBall Picture"
            />
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/js/index.js"></script>
  </body>
</html>
