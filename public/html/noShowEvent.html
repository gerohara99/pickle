<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RallyPoint - Event Not Found" />
    <link rel="icon" href="/img/favicon.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/rallypoint.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <script type="module" src="/js/index.js" defer></script>
    <title>RallyPoint - Event Not Found</title>
  </head>
  <body>
    <header>
      <h1>RallyPoint</h1>
    </header>
    
    <nav>
      <a href="/" aria-label="Home">
        <i class="fas fa-home"></i>
      </a>
      <a href="/events/myBrowse" aria-label="My Events">
        <i class="fas fa-calendar-check"></i>
      </a>
      <a href="/events/browseNew" aria-label="Find Events" class="active">
        <i class="fas fa-search"></i>
      </a>
      <a href="/me/myAccountDetails" aria-label="Profile">
        <i class="fas fa-user"></i>
      </a>
      <a href="/users/showAll" aria-label="Users" class="admin-only">
        <i class="fas fa-users"></i>
      </a>
      <a href="#" id="logoutButton" aria-label="Logout">
        <i class="fas fa-sign-out-alt"></i>
      </a>
    </nav>
    
    <main class="main">
      <section class="section">
        <div class="container">
          <div class="error-container">
            <div class="error-icon">
              <i class="fas fa-calendar-times"></i>
            </div>
            
            <h2 class="error-title">Event Not Found</h2>
            
            <p class="error-message">
              The event you're looking for doesn't exist or you don't have permission to view it.
            </p>
            
            <div class="error-actions">
              <a href="/events/browseNew" class="btn btn-primary">Browse Events</a>
              <a href="/events/create" class="btn btn-outline">Create New Event</a>
            </div>
          </div>
        </div>
      </section>
    </main>
    
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // Handle logout button
        document.getElementById('logoutButton').addEventListener('click', async function(e) {
          e.preventDefault();
          
          try {
            const response = await fetch('/api/v1/users/logout', {
              method: 'GET'
            });
            
            if (response.ok) {
              // Redirect to login page
              window.location.href = '/login';
            } else {
              alert('Failed to logout. Please try again.');
            }
          } catch (err) {
            console.error('Error logging out:', err);
            alert('An error occurred while trying to logout');
          }
        });
      });
    </script>
  </body>
</html>
