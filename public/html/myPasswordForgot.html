<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="Pickleball admin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/img/favicon.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/mediaQueries.css" />
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.4.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule=""
      src="https://unpkg.com/ionicons@5.4.0/dist/ionicons/ionicons.js"
    ></script>
    <title>Pickleball| Admin</title>
  </head>
  <body>
    <header class="header">
      <a class="logo" href="/">
        <img src="/img/logo.png" alt="Pickle Logo" />
      </a>
    </header>
    
    <main class="main">
      <section class="section">
        <div class="crudContainer-1-cols">
          <div class="text-box">
            <div class="acResetPassword-text-box">
              <h1 class="heading-secondary">Forgot Your Password</h1>
              <form class="form-1-cols" id="forgotPasswordForm">
                <div>
                  <label for="email">Your Email</label>
                  <input name="email" type="email" id="email" required />
                </div>
                <div class="form-buttons">
                  <button
                    class="btn btn--form"
                    id="forgotPasswordButton"
                    type="submit"
                  >
                    Submit
                  </button>
                  <a class="btn btn--outline" id="cancelButton" href="/me/login">
                    Cancel
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/js/index.js"></script>
  </body>
</html>    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const forgotPasswordForm = document.getElementById('forgotPasswordForm');
        
        forgotPasswordForm.addEventListener('submit', async function(e) {
          e.preventDefault();
          
          const email = document.getElementById('email').value;
          
          try {
            const response = await fetch('/api/v1/users/forgotPassword', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ email })
            });
            
            const data = await response.json();
            
            if (response.ok) {
              // Clear the form
              forgotPasswordForm.reset();
              
              // Show success message
              alert('Password reset link sent to your email!');
              
              // Redirect to login page after a delay
              setTimeout(() => {
                window.location.href = '/login';
              }, 3000);
            } else {
              // Show error message
              alert(`Error: ${data.message || 'Failed to send reset link'}`);
            }
          } catch (err) {
            console.error('Error sending reset link:', err);
            alert('An error occurred while sending the reset link');
          }
        });
      });
    </script>
  </body>
</html>
